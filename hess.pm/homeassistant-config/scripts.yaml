turn_on_all_lights:
  alias: Turn on all lights
  description: Turns on every light entity in the house
  sequence:
  - action: light.turn_on
    target:
      entity_id: all

turn_off_all_lights:
  alias: Turn off all lights
  description: Turns off every light entity in the house
  sequence:
  - action: light.turn_off
    target:
      entity_id: all

katzenalarm_benachrichtigung:
  alias: Katzenalarm Benachrichtigung
  description: Delivers a cat escape warning. Holds the notification channel in one place so it
    can be swapped without touching the automation.
  fields:
    nachricht:
      name: Nachricht
      description: Spoken text of the warning
      required: true
      selector:
        text:
  sequence:
  - variables:
      echos:
      - media_player.schlafzimmer
      - media_player.buero
      - media_player.badezimmer
      - media_player.kueche
      - media_player.alexa_studio
      - media_player.wohnzimmer_tv
  - action: media_player.volume_set
    target:
      entity_id: '{{ echos }}'
    data:
      volume_level: 0.8
    note: A warning nobody can hear is worthless, so the volume is forced before speaking.
  - action: notify.alexa_media_ueberall
    data:
      message: '{{ nachricht }}'
      data:
        type: announce
    note: The group target speaks only via announce, while a single device speaks only via
      plain TTS. Both combinations were verified on this account.
  - delay: '00:00:10'
    note: Announcement runs asynchronously on the devices; lowering the volume at once would cut
      it off.
  - action: media_player.volume_set
    target:
      entity_id: '{{ echos }}'
    data:
      volume_level: 0.4
    note: A fixed everyday volume instead of each speaker's previous one. A speaker reports no
      volume_level unless Home Assistant set or polled one recently, so the previous volume is
      usually unknown and the speakers would otherwise stay at the alarm volume.
  mode: queued
  max: 5

dach_bathroom_radio_play:
  alias: Dach bathroom radio play
  description: Plays the station selected in input_select.badezimmer_radio_sender on the bathroom
    Echo (Alexa Badezimmer) only. Falls back to HR3 while the selection has no usable value.
  icon: mdi:radio
  sequence:
  - action: media_player.play_media
    target:
      entity_id: media_player.badezimmer
    data:
      media_content_type: custom
      media_content_id: >-
        {% set sender = states('input_select.badezimmer_radio_sender') %}
        Spiele {{ sender if sender not in ['unknown', 'unavailable', ''] else 'HR3' }}
    note: A custom content type makes this one Echo run the text as if it had been spoken to it,
      so the radio plays exactly where the command was sent. The text must be in the Echo's
      language (German); Alexa picks the radio provider (usually TuneIn) for the station itself.

dach_bathroom_radio_stop:
  alias: Dach bathroom radio stop
  description: Stops whatever plays on the bathroom Echo (Alexa Badezimmer); other Echos keep
    playing.
  icon: mdi:stop
  sequence:
  - action: media_player.media_stop
    target:
      entity_id: media_player.badezimmer
    note: media_stop sends Alexa's stop control addressed to this Echo's serial number. Do not send
      "Stopp" as a custom voice command instead; Alexa treats a spoken stop that reaches an Echo
      with nothing playing as "stop everything" and silences the other Echos too.

reminder_announcement:
  alias: Reminder announcement
  description: Speaks a household reminder on every Echo at the volume each one is set to.
    Unlike the cat escape alarm it never raises the volume, because a reminder must not be
    louder than the room was left.
  fields:
    message:
      name: Message
      description: Spoken text (German, the Echos' language)
      required: true
      selector:
        text:
  sequence:
  - action: notify.alexa_media_ueberall
    data:
      message: '{{ message }}'
      data:
        type: announce
    note: The group target speaks only via announce; plain TTS to it is silently dropped.
  mode: queued
  max: 10

mark_trash_put_out:
  alias: Mark trash put out
  description: Records that the bins are outside, which silences tonight's remaining trash
    reminders. Called by the dashboard button and the SW-Reminder-Trash-Out button.
  sequence:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.trash_put_out
    data:
      timestamp: '{{ now().timestamp() }}'
  - action: script.reminder_announcement
    data:
      message: Der Müll ist draußen.
    note: Spoken confirmation, because the Zigbee button itself gives no feedback.
  mode: single

