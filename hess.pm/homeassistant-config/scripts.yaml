turn_on_all_lights:
  alias: Turn on all lights
  description: Turns on every light entity in the house
  sequence:
  - action: light.turn_on
    target:
      entity_id: all

turn_off_all_lights:
  alias: Turn off all lights
  description: Turns off every light entity in the house
  sequence:
  - action: light.turn_off
    target:
      entity_id: all

katzenalarm_benachrichtigung:
  alias: Katzenalarm Benachrichtigung
  description: Delivers a cat escape warning. Holds the notification channel in one place so it
    can be swapped without touching the automation.
  fields:
    nachricht:
      name: Nachricht
      description: Spoken text of the warning
      required: true
      selector:
        text:
  sequence:
  - action: notify.alexa_media_schlafzimmer
    data:
      message: '{{ nachricht }}'
    note: Plain TTS, not type announce. Announcements are accepted by the integration with no
      error and never play on this account, while TTS is audible.
  mode: queued
  max: 5
