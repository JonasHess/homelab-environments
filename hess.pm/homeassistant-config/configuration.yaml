# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: yaml
  dashboards:
    lovelace-home:
      mode: yaml
      filename: home-dashboard.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true
    lovelace-wohnzimmer:
      mode: yaml
      filename: wohnzimmer-dashboard.yaml
      title: Wohnzimmer
      icon: mdi:sofa
      show_in_sidebar: true
    lovelace-szenen:
      mode: yaml
      filename: szenen-dashboard.yaml
      title: Szenen
      icon: mdi:palette
      show_in_sidebar: true
    lovelace-klima:
      mode: yaml
      filename: klima-dashboard.yaml
      title: Klima
      icon: mdi:thermometer
      show_in_sidebar: true
    lovelace-sicherheit:
      mode: yaml
      filename: sicherheit-dashboard.yaml
      title: Sicherheit
      icon: mdi:shield-home
      show_in_sidebar: true
    lovelace-medien:
      mode: yaml
      filename: medien-dashboard.yaml
      title: Medien
      icon: mdi:multimedia
      show_in_sidebar: true
    lovelace-system:
      mode: yaml
      filename: system-dashboard.yaml
      title: System
      icon: mdi:cog
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
alexa: !include alexa.yaml

input_number:
  # Timings for the cat escape alarm. Both omit initial: so a value set in the UI survives a
  # restart; on a fresh install they start at their minimum and have to be set once.
  katzenalarm_verzoegerung:
    name: Katzenalarm Verzögerung
    icon: mdi:cat
    min: 5
    max: 600
    step: 5
    unit_of_measurement: s
    mode: slider
  katzenalarm_wiederholung:
    name: Katzenalarm Wiederholung
    icon: mdi:cat
    min: 15
    max: 900
    step: 15
    unit_of_measurement: s
    mode: slider
  # Timings for the 1OG bathroom fan. Both omit initial: so a value set in the UI survives a
  # restart; on a fresh install they start at their minimum and have to be set once. The
  # automation falls back to 3 and 10 minutes while a slider has no usable value.
  badezimmer_luefter_verzoegerung:
    name: Badezimmer Lüfter Verzögerung
    icon: mdi:fan-clock
    min: 1
    max: 15
    step: 1
    unit_of_measurement: min
    mode: slider
  badezimmer_luefter_nachlauf:
    name: Badezimmer Lüfter Nachlauf
    icon: mdi:fan-clock
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    mode: slider
  # Longest the fan may run on humidity alone per shower. Without initial: like the sliders above;
  # the automation falls back to 30 minutes while it has no usable value.
  badezimmer_luefter_feuchte_max:
    name: Badezimmer Lüfter Feuchte Maximum
    icon: mdi:water-percent-alert
    min: 5
    max: 120
    step: 5
    unit_of_measurement: min
    mode: slider
  # Run-on time of the cellar workshop and laundry lights after the room has been empty. Both omit
  # initial: so a value set in the UI survives a restart; on a fresh install they start at their
  # minimum and have to be set once. The automations fall back to 10 minutes while a slider has no
  # usable value.
  werkstatt_licht_nachlauf:
    name: Werkstatt Licht Nachlauf
    icon: mdi:timer-outline
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    mode: slider
  waschkueche_licht_nachlauf:
    name: Waschkueche Licht Nachlauf
    icon: mdi:timer-outline
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    mode: slider

input_boolean:
  # Master switch for the cat escape alarm, flipped from the dashboard and later from a Zigbee
  # remote. A helper rather than automation.turn_off: the automation entity stays enabled, so
  # it keeps producing traces, and one flag means both controls cannot disagree.
  # initial: true deliberately overrides the restored state on every restart. A helper without
  # it comes up off the very first time, and an alarm that is silently off protects nothing;
  # re-arming on restart errs towards a false alarm instead of a lost cat. The cost is that a
  # deliberate "off" does not survive a restart.
  katzenalarm_aktiv:
    name: Katzenalarm aktiv
    icon: mdi:cat
    initial: true

  # Set by the left rocker of the workshop switch (Down): presence does not light the workshop until
  # the room has been empty once. initial: false resets a pause on every restart.
  werkstatt_licht_pausiert:
    name: Werkstatt Licht pausiert
    icon: mdi:lightbulb-off-outline
    initial: false

  # Set once the fan has run on humidity for the maximum time; humidity cannot start the fan again
  # until it has fallen back near the baseline. No initial: so a block survives a restart, otherwise
  # every restart during a humid spell would allow another full run.
  badezimmer_luefter_feuchte_gesperrt:
    name: Badezimmer Lüfter Feuchte gesperrt
    icon: mdi:fan-off

  # On while the Dach bathroom radio was started by the automation, so only that music is stopped
  # again: radio someone started by voice keeps playing when the door opens. No initial: so the
  # flag survives a restart and a session that was running still ends with a stop.
  badezimmer_dach_radio_aktiv:
    name: Badezimmer Dach Radio aktiv
    icon: mdi:radio

input_select:
  # Station the bathroom radio script plays. Each option is spoken to the Echo as "Spiele <option>",
  # so it must be a name Alexa recognises in German. No initial: so the last selection survives a
  # restart; on a fresh install the first option is selected.
  badezimmer_radio_sender:
    name: Badezimmer Radiosender
    icon: mdi:radio
    options:
    - HR3
    - HR1
    - YOU FM
    - Hit Radio FFH
    - SWR3
    - Deutschlandfunk

input_datetime:
  # When a recurring chore was last done, set by the dashboard buttons (and later by Zigbee
  # buttons) through script.mark_trash_put_out / script.mark_cat_litter_changed. Done today
  # silences the remaining reminders of the day. A timestamp rather than an on/off flag needs no
  # midnight reset, and a mistaken press is undone by editing the time. No initial: so the value
  # survives a restart.
  trash_put_out:
    name: Trash put out
    icon: mdi:trash-can-outline
    has_date: true
    has_time: true
  cat_litter_changed:
    name: Cat litter changed
    icon: mdi:cat
    has_date: true
    has_time: true

timer:
  # Counts the humidity-only run time of the 1OG bathroom fan. restore: true keeps a running
  # countdown across an HA restart.
  badezimmer_luefter_feuchte_limit:
    name: Badezimmer Lüfter Feuchte Limit
    icon: mdi:timer-sand
    restore: true

sensor:
  # Normal humidity of the 1OG bathroom: the median of the last 24 h. A shower lasts minutes and
  # barely moves it, while a humid spell raises it, so the fan reacts to showers and not to weather.
  - platform: statistics
    name: Badezimmer Feuchte Basis
    unique_id: badezimmer_feuchte_basis
    entity_id: sensor.m01_humidity
    state_characteristic: median
    max_age:
      hours: 24
    sampling_size: 1000
    precision: 1

template:
  - binary_sensor:
      # On while the 1OG bathroom is clearly more humid than its baseline (a shower). Hysteresis:
      # on at baseline + 12 points, off at baseline + 5, unchanged in between. Shower peaks seen so
      # far were +15 to +29 points, normal noise about 3. Off when the reading is older than 3 h or
      # missing, so a dead sensor can never keep the fan running.
      # ASCII name so the entity id is binary_sensor.badezimmer_luefter_feuchte.
      - name: Badezimmer Luefter Feuchte
        unique_id: badezimmer_luefter_feuchte
        icon: mdi:water-percent
        state: >-
          {% set s = states.sensor.m01_humidity %}
          {% set h = states('sensor.m01_humidity') | float(none) %}
          {% set b = states('sensor.badezimmer_feuchte_basis') | float(none) %}
          {% set fresh = s is not none and h is not none and now() - s.last_reported < timedelta(hours=3) %}
          {% if not fresh or b is none %}false
          {% elif h >= b + 12 %}true
          {% elif h <= b + 5 %}false
          {% else %}{{ this.state == 'on' }}{% endif %}

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.0.0.0/8
    - 127.0.0.1
    - ::1
api:
