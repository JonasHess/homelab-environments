# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: yaml
  dashboards:
    lovelace-home:
      mode: yaml
      filename: home-dashboard.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true
    lovelace-wohnzimmer:
      mode: yaml
      filename: wohnzimmer-dashboard.yaml
      title: Wohnzimmer
      icon: mdi:sofa
      show_in_sidebar: true
    lovelace-szenen:
      mode: yaml
      filename: szenen-dashboard.yaml
      title: Szenen
      icon: mdi:palette
      show_in_sidebar: true
    lovelace-klima:
      mode: yaml
      filename: klima-dashboard.yaml
      title: Klima
      icon: mdi:thermometer
      show_in_sidebar: true
    lovelace-sicherheit:
      mode: yaml
      filename: sicherheit-dashboard.yaml
      title: Sicherheit
      icon: mdi:shield-home
      show_in_sidebar: true
    lovelace-medien:
      mode: yaml
      filename: medien-dashboard.yaml
      title: Medien
      icon: mdi:multimedia
      show_in_sidebar: true
    lovelace-system:
      mode: yaml
      filename: system-dashboard.yaml
      title: System
      icon: mdi:cog
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
alexa: !include alexa.yaml

input_number:
  # Timings for the cat escape alarm. Both omit initial: so a value set in the UI survives a
  # restart; on a fresh install they start at their minimum and have to be set once.
  katzenalarm_verzoegerung:
    name: Katzenalarm Verzögerung
    icon: mdi:cat
    min: 5
    max: 600
    step: 5
    unit_of_measurement: s
    mode: box
  katzenalarm_wiederholung:
    name: Katzenalarm Wiederholung
    icon: mdi:cat
    min: 15
    max: 900
    step: 15
    unit_of_measurement: s
    mode: box

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.0.0.0/8
    - 127.0.0.1
    - ::1
api:
