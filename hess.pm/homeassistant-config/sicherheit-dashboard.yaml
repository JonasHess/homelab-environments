      icon: mdi:door
    - type: tile
      entity: binary_sensor.balkontur_zi_strasse
      name: Balkontür ZI Strasse
      icon: mdi:door
    - type: tile
      entity: binary_sensor.fenster_garten
      name: Fenster Garten
      icon: mdi:window-closed-variant
    - type: tile
      entity: binary_sensor.fenster_wz
      name: Fenster WZ
      icon: mdi:window-closed-variant
    - type: tile
      entity: binary_sensor.dachfensdoor_window_contact_ii
      name: Dachfenster
      icon: mdi:window-closed-variant
    - type: tile
      entity: binary_sensor.0x00158d00033ab58e_contact
      name: Kontakt
      icon: mdi:door

