- id: '1769268645698'
  alias: Philips Hue Tap Dial Switch (Z2M / ZHA)
  description: Controls Esszimmer and Wohnzimmer lights via Hue Tap Dial
  use_blueprint:
    path: danielpetrovic/philips-hue-tap-dial-switch.yaml
    input:
      integration_type:
      - z2m
      z2m_base_topic: zigbee2mqtt
      z2m_device_name: Esszimmer Dimmer Tab
      last_pressed: input_text.esszimmer_hue_tab_dial_last_pressed_state
      button_1_light:
        entity_id: light.esszimmer
      button_1_short_release_light_mode:
      - turn_on
      button_1_dimming_speed: 7
      button_2_press:
      - action: light.toggle
        target:
          entity_id: light.esszimmer
      button_2_light:
        entity_id: light.esszimmer
      button_3_light:
        entity_id: light.esszimmer
      button_4_light:
        entity_id: light.wohnzimmer
      button_4_dimming_speed: 10
      button_4_short_release_light_mode:
      - turn_on

- id: '1769443006186'
  alias: Forward Hue Dimmer ZHA events to MQTT
  description: Forwards RWL022 dimmer events to zigbee2mqtt-compatible topic format
  triggers:
  - trigger: event
    event_type: zha_event
  conditions:
  - condition: template
    value_template: >
      {{ trigger.event is defined
         and trigger.event.data is defined
         and trigger.event.data.device_id is defined
         and device_attr(trigger.event.data.device_id, 'model') == 'RWL022'
         and trigger.event.data.command in ['on_press', 'on_hold', 'on_short_release', 'on_long_release',
                                            'off_press', 'off_hold', 'off_short_release', 'off_long_release',
                                            'up_press', 'up_hold', 'up_short_release', 'up_long_release',
                                            'down_press', 'down_hold', 'down_short_release', 'down_long_release'] }}
  actions:
  - variables:
      device_name: >
        {{ device_attr(trigger.event.data.device_id, 'name_by_user')
           or device_attr(trigger.event.data.device_id, 'name') }}
      translated_action: >
        {% set cmd = trigger.event.data.command %}
        {% if cmd.endswith('_short_release') %}
          {{ cmd.replace('_short_release', '_press_release') }}
        {% elif cmd.endswith('_long_release') %}
          {{ cmd.replace('_long_release', '_hold_release') }}
        {% else %}
          {{ cmd }}
        {% endif %}
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/{{ device_name }}/action
      payload: '{{ {"action": translated_action} | to_json }}'
      qos: 1
  mode: parallel
  max: 10

- id: '1739055600000'
  alias: Turn off all lights at 03:00
  description: Turns off all lights every night at 03:00
  triggers:
  - trigger: time
    at: '03:00:00'
  actions:
  - action: script.turn_off_all_lights
  mode: single

- id: '1764593100000'
  alias: Schlafzimmer wake-up time announcement
  description: Announces the current time every five minutes while bedroom presence remains active.
  triggers:
  - trigger: time_pattern
    minutes: '/5'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: time
    after: '08:44:00'
    before: '10:46:00'
  - condition: state
    entity_id: binary_sensor.m09_presence
    state: 'on'
  actions:
  - variables:
      previous_volume: "{{ state_attr('media_player.schlafzimmer', 'volume_level') | float(0.5) }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.schlafzimmer
    data:
      volume_level: "{{ 1.0 if now().strftime('%H:%M') >= '10:00' else 0.5 }}"
  - action: notify.alexa_media_schlafzimmer
    data:
      message: "Es ist {{ now().strftime('%H:%M') }} Uhr."
    note: Plain TTS, not type announce. Announcements are accepted by the integration with no
      error and never play on this account, while TTS is audible.
  - delay: '00:00:10'
  - action: media_player.volume_set
    target:
      entity_id: media_player.schlafzimmer
    data:
      volume_level: '{{ previous_volume }}'
  mode: single

- id: '1764594000000'
  alias: Schlafzimmer weekend wake-up time announcement
  description: Announces the current time every 15 minutes while bedroom presence remains active on weekends.
  triggers:
  - trigger: time_pattern
    minutes: '/15'
  conditions:
  - condition: time
    weekday:
    - sat
    - sun
  - condition: time
    after: '09:59:00'
    before: '13:01:00'
  - condition: state
    entity_id: binary_sensor.m09_presence
    state: 'on'
  actions:
  - variables:
      previous_volume: "{{ state_attr('media_player.schlafzimmer', 'volume_level') | float(0.5) }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.schlafzimmer
    data:
      volume_level: 0.5
  - action: notify.alexa_media_schlafzimmer
    data:
      message: "Es ist {{ now().strftime('%H:%M') }} Uhr."
    note: Plain TTS, not type announce. Announcements are accepted by the integration with no
      error and never play on this account, while TTS is audible.
  - delay: '00:00:10'
  - action: media_player.volume_set
    target:
      entity_id: media_player.schlafzimmer
    data:
      volume_level: '{{ previous_volume }}'
  mode: single

- id: '1791568080000'
  alias: Katzenalarm Wohnungstuer
  description: Warns while the own flat door stands open together with the Haustuer or the
    neighbour's flat door. Either combination gives the cats an unbroken route out of the
    building or into the other flat; one open door alone only reaches the stairwell.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.wohnungstuer_contact
    - binary_sensor.haustuer_contact
    - binary_sensor.wohnungstuer_nachbar_contact
    to:
    - 'on'
    - 'off'
    note: Only on and off count, so a sensor reporting unknown or unavailable stays silent
      instead of raising a false alarm.
  - trigger: homeassistant
    event: start
    note: A restart re-evaluates, otherwise doors left open across a restart would never alert.
  - trigger: state
    entity_id: input_boolean.katzenalarm_aktiv
    to:
    - 'on'
    - 'off'
    note: Switching the flag off restarts the run, whose conditions then fail, which ends a
      repeat loop already in progress. Switching it on re-checks doors that are already open.
  conditions:
  - condition: state
    entity_id: input_boolean.katzenalarm_aktiv
    state: 'on'
  - condition: state
    entity_id: binary_sensor.wohnungstuer_contact
    state: 'on'
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.haustuer_contact
      state: 'on'
    - condition: state
      entity_id: binary_sensor.wohnungstuer_nachbar_contact
      state: 'on'
  actions:
  - delay: "{{ states('input_number.katzenalarm_verzoegerung') | int(30) }}"
    note: Seconds. Any door change restarts the run, so a door closing here cancels the alert.
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.katzenalarm_aktiv
        state: 'on'
      - condition: state
        entity_id: binary_sensor.wohnungstuer_contact
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.haustuer_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.wohnungstuer_nachbar_contact
          state: 'on'
      sequence:
      - action: script.katzenalarm_benachrichtigung
        data:
          nachricht: Wohnungstür steht offen. Bitte schließen.
        note: Spoken on every Echo in the flat, so it names neither the door nor why it
          matters.
      - delay: "{{ states('input_number.katzenalarm_wiederholung') | int(60) }}"
  mode: restart

- id: '1792875427795'
  alias: 1OG bathroom fan follows the lights and humidity
  description: >-
    The fan is powered by the right relay of SW-1OG-Badezimmer-Flur, which is decoupled from the
    rockers, so nothing else switches it. Two reasons run it, and it stops only when neither holds.
    Lights: the bathroom has no window, so a bathroom light (mirror or ceiling) being on counts as
    the room being in use. A short visit never starts the fan. Once a light has been on for the delay
    in a row (input_number.badezimmer_luefter_verzoegerung, 3 minutes if unset) the fan starts, and
    this reason holds until both lights have been off for the run-on time
    (input_number.badezimmer_luefter_nachlauf, 10 minutes if unset).
    Humidity: binary_sensor.badezimmer_luefter_feuchte (a shower, measured against the 24 h
    baseline) starts the fan and timer.badezimmer_luefter_feuchte_limit. Humidity alone may run the
    fan for at most input_number.badezimmer_luefter_feuchte_max (30 minutes if unset); after that
    input_boolean.badezimmer_luefter_feuchte_gesperrt blocks humidity until the sensor is back near
    the baseline, so a humid spell or a stuck sensor cannot run the fan for hours.
  triggers:
  - trigger: template
    value_template: >-
      {{ is_state('light.badezimmer_spiegel', 'on') or is_state('light.badezimmer_oben', 'on') }}
    for:
      minutes: "{{ states('input_number.badezimmer_luefter_verzoegerung') | int(3) }}"
    id: long_use
  - trigger: template
    value_template: >-
      {{ not is_state('light.badezimmer_spiegel', 'on') and not is_state('light.badezimmer_oben', 'on') }}
    for:
      minutes: "{{ states('input_number.badezimmer_luefter_nachlauf') | int(10) }}"
    id: free
  - trigger: state
    entity_id: binary_sensor.badezimmer_luefter_feuchte
    to: 'on'
    id: humid
  - trigger: state
    entity_id: binary_sensor.badezimmer_luefter_feuchte
    from: 'on'
    id: dry
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.badezimmer_luefter_feuchte_limit
    id: humid_limit
  - trigger: homeassistant
    event: start
    id: startup
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: long_use
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sw_1og_badezimmer_flur_right
    - conditions:
      - condition: trigger
        id: humid
      - condition: state
        entity_id: input_boolean.badezimmer_luefter_feuchte_gesperrt
        state: 'off'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.badezimmer_luefter_feuchte_limit
        data:
          duration:
            minutes: "{{ states('input_number.badezimmer_luefter_feuchte_max') | int(30) }}"
      - action: switch.turn_on
        target:
          entity_id: switch.sw_1og_badezimmer_flur_right
    - conditions:
      - condition: trigger
        id: dry
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.badezimmer_luefter_feuchte_limit
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.badezimmer_luefter_feuchte_gesperrt
    - conditions:
      - condition: trigger
        id: humid_limit
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.badezimmer_luefter_feuchte_gesperrt
  # Off only when neither reason holds. The lights hold while one is on, and also while the run-on
  # time since the last light change has not passed yet - except at startup, where last_changed is
  # the restart time and would keep a fan running that no later trigger switches off.
  - if:
    - condition: trigger
      id:
      - free
      - dry
      - humid_limit
      - startup
    - condition: not
      conditions:
      - condition: state
        entity_id: timer.badezimmer_luefter_feuchte_limit
        state: active
    - condition: template
      value_template: >-
        {% set lights = expand('light.badezimmer_spiegel', 'light.badezimmer_oben') %}
        {% set n = states('input_number.badezimmer_luefter_nachlauf') | int(10) %}
        {% set any_on = lights | selectattr('state', 'eq', 'on') | list | count > 0 %}
        {% set in_run_on = trigger.id in ['dry', 'humid_limit']
             and (lights | map(attribute='last_changed') | max) > now() - timedelta(minutes=n) %}
        {{ not any_on and not in_run_on }}
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.sw_1og_badezimmer_flur_right
  mode: queued
  max: 10

- id: '1793050000001'
  alias: Keller Werkstatt light follows M02
  description: >-
    The workshop light has no smart bulb: it is powered through the left and the right relay of
    SW-KELLER-WERKSTATT, wired as an OR. The right relay is the plain manual switch (the rocker cuts
    the power itself). This automation drives the left relay from the presence sensor M02: on when
    the room is occupied, off once it has been empty for the run-on time
    (input_number.werkstatt_licht_nachlauf, 10 minutes if unset). While the light is paused by the
    left rocker (input_boolean.werkstatt_licht_pausiert) presence does not switch it on.
  triggers:
  - trigger: state
    entity_id: binary_sensor.m02_presence
    to: 'on'
    id: arrive
  - trigger: state
    entity_id: binary_sensor.m02_presence
    to: 'off'
    for:
      minutes: "{{ states('input_number.werkstatt_licht_nachlauf') | int(10) }}"
    id: empty
  - trigger: homeassistant
    event: start
    id: startup
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: arrive
      - condition: state
        entity_id: input_boolean.werkstatt_licht_pausiert
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sw_keller_werkstatt_left
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: empty
        - condition: trigger
          id: startup
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.m02_presence
          state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.sw_keller_werkstatt_left
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.werkstatt_licht_pausiert
  mode: restart

- id: '1793050000002'
  alias: Keller Werkstatt left rocker
  description: >-
    The left gang of SW-KELLER-WERKSTATT is decoupled, so its rocker only sends events. Top: light
    on now and presence control active. Bottom: left relay off and presence paused until the room
    has been empty once. Without this the right rocker could never switch off a light that the
    presence automation holds on through the left relay.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/SW-KELLER-WERKSTATT/action
    payload: single_left
    id: up
  - trigger: mqtt
    topic: zigbee2mqtt/SW-KELLER-WERKSTATT/action
    payload: single_left_down
    id: down
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: up
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.werkstatt_licht_pausiert
      - action: switch.turn_on
        target:
          entity_id: switch.sw_keller_werkstatt_left
    - conditions:
      - condition: trigger
        id: down
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.werkstatt_licht_pausiert
      - action: switch.turn_off
        target:
          entity_id: switch.sw_keller_werkstatt_left
  mode: queued

- id: '1793050000003'
  alias: Keller Waschkueche light follows M05
  description: >-
    The laundry room light has no smart bulb: the relay of SW-KELLER-WASCHKUECHE cuts its power. The
    switch stays in control_relay mode, so the rocker works by itself, and this automation also
    drives the relay from the presence sensor M05: on when the room is occupied, off once it has
    been empty for the run-on time (input_number.waschkueche_licht_nachlauf, 10 minutes if unset).
    A manual Off while someone is in the room stays off until the next arrival.
  triggers:
  - trigger: state
    entity_id: binary_sensor.m05_presence
    to: 'on'
    id: arrive
  - trigger: state
    entity_id: binary_sensor.m05_presence
    to: 'off'
    for:
      minutes: "{{ states('input_number.waschkueche_licht_nachlauf') | int(10) }}"
    id: empty
  - trigger: homeassistant
    event: start
    id: startup
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: arrive
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sw_keller_waschkueche_up
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: empty
        - condition: trigger
          id: startup
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.m05_presence
          state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.sw_keller_waschkueche_up
  mode: restart

- id: '1793050000004'
  alias: Keller stairs Off also turns off workshop and laundry
  description: >-
    SW-EG-KELLER-TREPPE-RUNTER (top of the cellar stairs, decoupled) turns off the cellar stairs light
    through smarthome4. The workshop and the laundry room have no smart bulbs, only relays, which
    smarthome4 cannot switch off, so this automation switches both relays of SW-KELLER-WERKSTATT and
    the relay of SW-KELLER-WASCHKUECHE off as well. The workshop presence light is paused until the
    room has been empty once, so it is not switched on again while someone is still inside.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/SW-EG-KELLER-TREPPE-RUNTER/action
    payload: single_down
  conditions: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.werkstatt_licht_pausiert
  - action: switch.turn_off
    target:
      entity_id:
      - switch.sw_keller_werkstatt_left
      - switch.sw_keller_werkstatt_right
      - switch.sw_keller_waschkueche_up
  mode: single

- id: '1793100000001'
  alias: Dach bathroom radio while the door is closed
  description: >-
    Plays the selected radio station (input_select.badezimmer_radio_sender) on the bathroom Echo
    while someone is in the Dach bathroom with the door closed, and
    stops it when the door opens or the room is empty. Door: contact sensor on the Dach bathroom
    door (binary_sensor.badezimmer_dach_tuer_contact, on = open). Presence: M12. The radio starts
    once per stay; input_boolean.badezimmer_dach_radio_aktiv marks music this automation started,
    and only that music is stopped. While the door sensor does not exist yet, its state is not
    'off', so the radio never starts.
  triggers:
  - trigger: state
    entity_id: binary_sensor.badezimmer_dach_tuer_contact
    to: 'off'
    id: start
  - trigger: state
    entity_id: binary_sensor.m12_presence
    to: 'on'
    id: start
  - trigger: state
    entity_id: binary_sensor.badezimmer_dach_tuer_contact
    to: 'on'
    id: stop
  # The grace time keeps a short presence dropout (someone standing very still) from stopping and
  # restarting the radio.
  - trigger: state
    entity_id: binary_sensor.m12_presence
    to: 'off'
    for:
      seconds: 30
    id: stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      - condition: state
        entity_id: binary_sensor.badezimmer_dach_tuer_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.m12_presence
        state: 'on'
      - condition: state
        entity_id: input_boolean.badezimmer_dach_radio_aktiv
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.badezimmer_dach_radio_aktiv
      - action: script.dach_bathroom_radio_play
    - conditions:
      - condition: trigger
        id: stop
      - condition: state
        entity_id: input_boolean.badezimmer_dach_radio_aktiv
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.badezimmer_dach_radio_aktiv
      - action: script.dach_bathroom_radio_stop
  mode: queued
  max: 5

- id: '1793200000001'
  alias: Trash reminder
  description: >-
    The evening before a waste collection, announces on every Echo which bins go out, at 18:10,
    19:10, 20:10 and 21:10, until someone marks the trash as put out (input_datetime.trash_put_out,
    set by script.mark_trash_put_out). The dates come from calendar.waste_collection, which the
    homeassistant-waste-sync CronJob fills from the provider every morning. The bin names are the
    provider's own event titles, spoken unchanged, so a new waste type needs no change here.
  triggers:
  - trigger: time
    at: '18:10:00'
  - trigger: time
    at: '19:10:00'
  - trigger: time
    at: '20:10:00'
  - trigger: time
    at: '21:10:00'
  conditions:
  - condition: template
    value_template: "{{ (state_attr('input_datetime.trash_put_out', 'timestamp') or 0) < today_at().timestamp() }}"
    note: Not yet marked as put out today. An unset helper has no timestamp and counts as not done.
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.waste_collection
    data:
      start_date_time: '{{ (today_at() + timedelta(days=1)).isoformat() }}'
      end_date_time: '{{ (today_at() + timedelta(days=2)).isoformat() }}'
    response_variable: tomorrow
  - variables:
      bins: "{{ tomorrow['calendar.waste_collection'].events | map(attribute='summary') | unique | list }}"
  - condition: template
    value_template: '{{ bins | count > 0 }}'
    note: No collection tomorrow, nothing to say.
  - action: script.reminder_announcement
    data:
      message: >-
        Morgen {{ 'wird ' ~ bins[0] if bins | count == 1 else 'werden ' ~ bins[:-1] | join(', ') ~ ' und ' ~ bins[-1] }}
        abgeholt. Bitte heute Abend rausstellen.
  mode: single

- id: '1793200000002'
  alias: Cat litter reminder
  description: >-
    Announces on every Echo that the cat litter is due, at 18:09, 19:09, 20:09 and 21:09, one
    minute before the trash reminder so the two never talk over each other. Due from Monday until
    someone marks it as changed (input_datetime.cat_litter_changed, set by
    script.mark_cat_litter_changed): a missed Monday keeps reminding every evening until done, and
    only a change since this week's Monday counts, so a change on Sunday does not skip Monday.
  triggers:
  - trigger: time
    at: '18:09:00'
  - trigger: time
    at: '19:09:00'
  - trigger: time
    at: '20:09:00'
  - trigger: time
    at: '21:09:00'
  conditions:
  - condition: template
    value_template: >-
      {{ (state_attr('input_datetime.cat_litter_changed', 'timestamp') or 0)
         < (today_at() - timedelta(days=now().weekday())).timestamp() }}
    note: Not changed since Monday 00:00 of this week. An unset helper counts as not done.
  actions:
  - action: script.reminder_announcement
    data:
      message: Bitte die Katzenstreu wechseln.
  mode: single

- id: '1793200000003'
  alias: Waste calendar health check
  description: >-
    Raises a persistent notification when the trash reminders would silently stop: the calendar
    has been unavailable for a day, or it holds no collection in the next 14 days. Residual waste
    alone is collected every 14 days, so an empty fortnight means the sync is broken (or the
    provider has not published the next year yet), never that there is simply nothing to collect.
    The CronJob's own failures are alerted by Prometheus (WasteSyncStale).
  triggers:
  - trigger: time
    at: '09:00:00'
  - trigger: state
    entity_id: calendar.waste_collection
    to: unavailable
    for:
      hours: 24
  conditions: []
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.waste_collection
    data:
      duration:
        days: 14
    response_variable: upcoming
    continue_on_error: true
    note: Fails while the calendar is unavailable; the check below then sees no events.
  - if:
    - condition: template
      value_template: "{{ upcoming is not defined or (upcoming['calendar.waste_collection'].events | default([]) | count) == 0 }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: waste_calendar_health
        title: Waste calendar has no upcoming collections
        message: >-
          calendar.waste_collection is {{ states('calendar.waste_collection') }} and lists no
          collection in the next 14 days, so no trash reminder will be announced. Check the
          homeassistant-waste-sync CronJob log in the argocd namespace.
    else:
    - action: persistent_notification.dismiss
      data:
        notification_id: waste_calendar_health
  mode: single

- id: '1793200000004'
  alias: Meter reading reminder
  description: >-
    Announces on every Echo that the meter readings are due, at 18:08, 19:08, 20:08 and 21:08, one
    minute before the cat litter reminder so the reminders never talk over each other. Due from the
    1st of each month until someone marks the readings as taken (input_datetime.meters_read, set by
    script.mark_meters_read): a missed 1st keeps reminding every evening until done, and only a
    reading since the 1st 00:00 of this month counts, so a reading on the 31st does not skip the
    next month.
  triggers:
  - trigger: time
    at: '18:08:00'
  - trigger: time
    at: '19:08:00'
  - trigger: time
    at: '20:08:00'
  - trigger: time
    at: '21:08:00'
  conditions:
  - condition: template
    value_template: >-
      {{ (state_attr('input_datetime.meters_read', 'timestamp') or 0)
         < today_at().replace(day=1).timestamp() }}
    note: Not read since the 1st 00:00 of this month. An unset helper counts as not done.
  actions:
  - action: script.reminder_announcement
    data:
      message: Bitte die Zählerstände ablesen.
  mode: single

- id: '1793200000005'
  alias: Sport reminder Jonas
  description: >-
    Announces on every Echo that Jonas is due for sport, at 18:07, 19:07, 20:07 and 21:07, staggered
    against the other evening reminders so they never talk over each other. Due once 7 or more
    calendar days have passed since Jonas's last workout (input_datetime.sport_jonas, set by
    script.mark_sport_jonas), so the week rolls with the last workout instead of a fixed weekday,
    and a missed day keeps reminding every evening until done.
  triggers:
  - trigger: time
    at: '18:07:00'
  - trigger: time
    at: '19:07:00'
  - trigger: time
    at: '20:07:00'
  - trigger: time
    at: '21:07:00'
  variables:
    days: >-
      {{ (now().date() - as_datetime(state_attr('input_datetime.sport_jonas', 'timestamp') or 0)
          .astimezone(now().tzinfo).date()).days }}
  conditions:
  - condition: template
    value_template: '{{ days >= 7 }}'
    note: An unset helper is 1970, so it counts as due.
  actions:
  - action: script.reminder_announcement
    data:
      message: 'Jonas, Zeit für Sport: dein letztes Training ist {{ days }} Tage her.'
  mode: single

